 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJ NETWORKS - Catálogo Oficial</title>
    <style>
        :root { --cian: #00d4ff; --magenta: #ff00ff; --oscuro: #0a0a0a; --bg-card: #111; }
        body { background: var(--oscuro); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .header { padding: 40px 20px; text-align: center; border-bottom: 2px solid var(--cian); background: linear-gradient(to bottom, #1a1a1a, var(--oscuro)); }
        .header-logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--cian); box-shadow: 0 0 15px var(--cian); object-fit: cover; }
        .tienda-nombre { font-size: 24px; font-weight: 900; margin-top: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .seccion-titulo { color: var(--cian); text-transform: uppercase; font-size: 14px; margin: 30px 20px 10px; border-left: 4px solid var(--cian); padding-left: 10px; font-weight: 800; }
        .catalogar { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; padding: 0 20px 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { border-color: var(--magenta); transform: translateY(-3px); }
        .img-container { width: 100%; height: 140px; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; min-height: 32px; }
        .selector-opciones { width: 100%; padding: 8px; background: #222; color: var(--cian); border: 1px solid #444; border-radius: 5px; margin-bottom: 10px; font-size: 12px; font-weight: bold; }
        .btn-comprar { background: var(--cian); color: black; border: none; width: 100%; padding: 10px; border-radius: 5px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        #modal-nombre { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 2px solid var(--magenta); text-align: center; width: 85%; max-width: 300px; }
        .modal-content input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 5px; border: 1px solid #444; background: #000; color: white; text-align: center; box-sizing: border-box; }
        .btn-confirmar { background: var(--magenta); color: white; border: none; padding: 10px; border-radius: 5px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://i.pinimg.com/736x/21/6b/94/216b9442080072b220c34538d5830b91.jpg" class="header-logo">
        <div class="tienda-nombre">SJ NETWORKS</div>
    </div>

    <div class="seccion-titulo">📶 INTERNET ILIMITADO</div>
    <div id="cat-internet" class="catalogar"></div>

    <div class="seccion-titulo">📺 CUENTAS POR PANTALLA</div>
    <div id="cat-streaming" class="catalogar"></div>

    <div class="seccion-titulo">🔥 COMBOS Y CARGAS</div>
    <div id="cat-otros" class="catalogar"></div>

    <div id="modal-nombre">
        <div class="modal-content">
            <h3>PEDIDO SJ NETWORKS 💀</h3>
            <input type="text" id="input-nombre" placeholder="Ingresá tu nombre">
            <button class="btn-confirmar" onclick="enviarPedido()">ENVIAR A JACK</button>
        </div>
    </div>

    <script>
        const productos = [
            { cat: "internet", nombre: "Lurzavic (Personal)", img: "https://i.ibb.co/L6S8tG0/internet-vph.jpg", opciones: ["30 Días ➝ $10.000", "PRUEBA GRATIS"] },
            { cat: "streaming", nombre: "Netflix Premium", img: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400", opciones: ["1 Disp ➝ $6.000", "2 Disp ➝ $8.000", "3 Disp ➝ $12.000"] },
            { cat: "streaming", nombre: "Disney+ Premium", img: "https://images.unsplash.com/photo-1635334336040-3b4f69747c3e?w=400", opciones: ["1 Disp ➝ $5.000", "2 Disp ➝ $7.000", "3 Disp ➝ $14.000"] },
            { cat: "streaming", nombre: "Prime Video", img: "https://images.unsplash.com/photo-1585647347384-2593bcc357d3?w=400", opciones: ["1 Disp ➝ $4.000", "2 Disp ➝ $6.500", "3 Disp ➝ $9.500"] },
            { cat: "streaming", nombre: "HBO Max", img: "https://images.unsplash.com/photo-1616469829581-73993eb86b02?w=400", opciones: ["1 Disp ➝ $5.000", "2 Disp ➝ $8.000", "3 Disp ➝ $12.000"] },
            { cat: "streaming", nombre: "Paramount+", img: "https://images.unsplash.com/photo-1627873649417-c67f701f1949?w=400", opciones: ["1 Disp ➝ $3.600", "2 Disp ➝ $4.800", "3 Disp ➝ $5.700"] },
            { cat: "streaming", nombre: "Crunchyroll", img: "https://images.unsplash.com/photo-1578632280436-47343e061730?w=400", opciones: ["1 Disp ➝ $4.000", "2 Disp ➝ $6.000", "3 Disp ➝ $10.000"] },
            { cat: "otros", nombre: "Combo 4 en 1", img: "https://i.ibb.co/6y5S3K0/meli.jpg", opciones: ["1 Disp ➝ $9.400"] },
            { cat: "otros", nombre: "Cargas Free Fire", img: "https://i.pinimg.com/736x/0a/6c/0e/0a6c0e52a8b981503893322675685785.jpg", opciones: ["Consultar Pack 💎"] }
        ];

        let itemActual = "";
        function render() {
            productos.forEach((p, i) => {
                const cont = document.getElementById(`cat-${p.cat}`);
                let opts = p.opciones.map(o => `<option value="${o}">${o}</option>`).join('');
                cont.innerHTML += `<div class="card"><div class="img-container"><img src="${p.img}" class="card-img"></div><div class="card-body"><div class="card-title">${p.nombre}</div><select id="sel-${i}" class="selector-opciones">${opts}</select><button class="btn-comprar" onclick="pedir(${i})">Comprar</button></div></div>`;
            });
        }
        function pedir(i) {
            itemActual = `🛒 *${productos[i].nombre}*%0A📍 Opción: *${document.getElementById('sel-'+i).value}*`;
            document.getElementById('modal-nombre').style.display = 'flex';
        }
        function enviarPedido() {
            const nom = document.getElementById('input-nombre').value;
            if(!nom) return alert("Poné tu nombre.");
            window.open(`https://wa.me/5491134361679?text=¡Hola JACK! 💀%0A%0AMi nombre: *${nom}*%0APedido:%0A${itemActual}`);
            document.getElementById('modal-nombre').style.display = 'none';
        }
        window.onload = render;
    </script>
</body>
</html>
