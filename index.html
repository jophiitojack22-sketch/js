 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSNETWORKS - Catálogo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #050505;
            --card: #0f0f0f;
            --blue: #00d4ff;
            --text: #ffffff;
            --border: #1a1a1a;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding-bottom: 90px;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #001a2e, var(--bg));
            border-bottom: 1px solid var(--blue);
        }

        .logo-placeholder {
            font-size: 50px;
            color: var(--blue);
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--blue);
        }

        .container {
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .product-info {
            padding: 12px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .product-price {
            color: var(--blue);
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .btn-add {
            background: transparent;
            color: var(--blue);
            border: 1px solid var(--blue);
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add:active {
            background: var(--blue);
            color: #000;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #001a2e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--blue);
            box-sizing: border-box;
            z-index: 100;
        }

        .total-info { display: flex; flex-direction: column; }
        .total-label { font-size: 12px; color: #888; }
        .total-price { font-size: 20px; font-weight: bold; color: var(--blue); }

        .btn-checkout {
            background: #25d366;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

<header>
    <div class="logo-placeholder"><i class="fas fa-ghost"></i></div>
    <h1 style="margin:0; font-size: 1.4rem; letter-spacing: 3px; color: var(--blue);">JSNETWORKS</h1>
    <p style="font-size: 0.8rem; color: #888; margin-top: 5px;">TIENDA OFICIAL</p>
</header>

<div class="container" id="catalog"></div>

<div class="cart-bar">
    <div class="total-info">
        <span class="total-label">TU PEDIDO:</span>
        <span class="total-price">$<span id="total">0</span></span>
    </div>
    <a href="#" class="btn-checkout" onclick="sendWhatsApp()">
        <i class="fab fa-whatsapp"></i> COMPRAR
    </a>
</div>

<script>
    const products = [
        { name: "HBO + Disney", price: 14000, img: "https://images.vrt.be/width1280/2024/05/08/6034633f-0d36-11ef-9387-02b6088fd4eb.jpg" },
        { name: "HBO + Prime", price: 10000, img: "https://i.blogs.es/1608d1/prime-video-max/1366_2000.jpeg" },
        { name: "Netflix 1 Disp", price: 6000, img: "https://variety.com/wp-content/uploads/2020/05/netflix-logo.png" },
        { name: "Disney+ Premium", price: 5000, img: "https://static-assets.bamgrid.com/product/disneyplus/images/share-default.14f44445346633f5ca97412f0534a7a8.png" },
        { name: "HBO Max 1 Disp", price: 5000, img: "https://hbomax-images.warnermediacdn.com/2020-05/square.png" },
        { name: "Amazon Prime", price: 6000, img: "https://m.media-amazon.com/images/G/01/primevideo/seo/primevideo-seo-logo.png" },
        { name: "VIX Plus Full", price: 4000, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6A7TzK6D_J9mS-vT_z6v8xO-u7W3X7i8z9w&s" },
        { name: "Paramount+ Full", price: 6000, img: "https://www.paramountplus.com/thumbnails/vms/files/2021/02/10/0s0S0S0S0S0S0S0S0S0S0S0S0S0S0S0S.jpg" },
        { name: "Internet 30 Días", price: 10000, img: "https://play-lh.googleusercontent.com/I76Pz7_Yyv_O8Xp0X7h1O9z_u8W6b_j_O8Xp0X7h1O9z_u8W6b_j_O8Xp0X7h1O9z_u8W" },
        { name: "Free Fire 520 💎", price: 8000, img: "https://i.pinimg.com/736x/8d/8a/8d/8d8a8d1b1b1b1b1b1b1b1b1b1b1b1b1b.jpg" }
    ];

    let cart = [];
    let total = 0;

    function render() {
        const catalog = document.getElementById('catalog');
        products.forEach((p, i) => {
            catalog.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/150/111/00d4ff?text=JS'">
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">$${p.price.toLocaleString()}</div>
                        <button class="btn-add" onclick="addToCart(${i})">AÑADIR</button>
                    </div>
                </div>`;
        });
    }

    function addToCart(i) {
        cart.push(products[i]);
        total += products[i].price;
        document.getElementById('total').innerText = total.toLocaleString();
    }

    function sendWhatsApp() {
        if (cart.length === 0) return alert("Seleccioná un servicio primero");
        let msg = "¡Hola *JSNETWORKS*! 👋 Quiero contratar:%0A%0A";
        cart.forEach(p => msg += `🔹 *${p.name}* - $${p.price.toLocaleString()}%0A`);
        msg += `%0A💰 *TOTAL: $${total.toLocaleString()}*%0A%0A¿Cuáles son los medios de pago?`;
        window.open(`https://wa.me/5491134361679?text=${msg}`);
    }

    render();
</script>
</body>
</html>
