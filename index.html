 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSNETWORKS - Premium Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #0d0d0d;
            --neon-blue: #00d4ff;
            --neon-purple: #9d00ff;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* Fondo con estrellas o partículas */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
            z-index: -1;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }

        .logo-main {
            width: 90px;
            height: 90px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" stroke="%2300d4ff" stroke-width="2" fill="none"/><path d="M30 40 Q50 60 70 40 M35 35 A2 2 0 1 1 35 36 M65 35 A2 2 0 1 1 65 36" stroke="%2300d4ff" stroke-width="3" fill="none"/></svg>');
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 10px var(--neon-blue));
        }

        h1 { font-size: 1.8rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px solid #1a1a1a;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .card-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-bottom: 1px solid #1a1a1a;
        }

        .card-body { padding: 15px; text-align: center; }
        
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; height: 35px; overflow: hidden; }
        
        .card-price { font-size: 18px; color: var(--neon-blue); font-weight: 900; margin-bottom: 15px; }

        .btn-buy {
            background: linear-gradient(45deg, var(--neon-blue), #0082ff);
            color: #000;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
        }

        /* Carrito Flotante Estilo LUU */
        .footer-cart {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--neon-blue);
            border-radius: 20px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .total-box { display: flex; flex-direction: column; }
        .total-box span { font-size: 10px; color: var(--text-dim); }
        .total-box strong { font-size: 20px; color: var(--neon-blue); }

        .btn-whatsapp {
            background: #25d366;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-main"></div>
    <h1>JSNETWORKS</h1>
    <p style="color: var(--text-dim); font-size: 12px;">SERVICIO DIGITAL • ARGENTINA</p>
</header>

<div class="grid" id="catalog">
    </div>

<div class="footer-cart">
    <div class="total-box">
        <span>TOTAL ESTIMADO</span>
        <strong>$<span id="total-val">0</span></strong>
    </div>
    <a href="#" class="btn-whatsapp" onclick="finalizarPedido()">
        <i class="fab fa-whatsapp"></i> PEDIR
    </a>
</div>

<script>
    const items = [
        { n: "Combo HBO + Disney+", p: 14000, img: "https://images.vrt.be/width1280/2024/05/08/6034633f-0d36-11ef-9387-02b6088fd4eb.jpg" },
        { n: "Netflix 1 Pantalla", p: 6000, img: "https://variety.com/wp-content/uploads/2020/05/netflix-logo.png" },
        { n: "Disney+ Premium", p: 5000, img: "https://static-assets.bamgrid.com/product/disneyplus/images/share-default.14f44445346633f5ca97412f0534a7a8.png" },
        { n: "Amazon Prime Video", p: 6000, img: "https://m.media-amazon.com/images/G/01/primevideo/seo/primevideo-seo-logo.png" },
        { n: "Lurzavic Internet 30D", p: 10000, img: "https://img.freepik.com/vector-premium/logotipo-vpn-proteccion-internet-privacidad-seguridad-red-datos-seguros_651234-111.jpg" },
        { n: "Free Fire 520 💎", p: 8000, img: "https://i.pinimg.com/736x/8d/8a/8d/8d8a8d1b1b1b1b1b1b1b1b1b1b1b1b1b.jpg" },
        { n: "Canva Pro 1 Mes", p: 4500, img: "https://logos-world.net/wp-content/uploads/2022/11/Canva-Logo.png" }
    ];

    let carrito = [];
    let total = 0;

    function init() {
        const catalog = document.getElementById('catalog');
        items.forEach((item, i) => {
            catalog.innerHTML += `
                <div class="card">
                    <img src="${item.img}" class="card-img" onerror="this.src='https://via.placeholder.com/150/111/00d4ff?text=Streaming'">
                    <div class="card-body">
                        <div class="card-title">${item.n}</div>
                        <div class="card-price">$${item.p.toLocaleString()}</div>
                        <button class="btn-buy" onclick="agregar(${i})">AGREGAR</button>
                    </div>
                </div>
            `;
        });
    }

    function agregar(i) {
        carrito.push(items[i]);
        total += items[i].p;
        document.getElementById('total-val').innerText = total.toLocaleString();
    }

    function finalizarPedido() {
        if(carrito.length === 0) return alert("Selecciona un servicio");
        let msg = "¡Hola *JSNETWORKS*! 👋 Me gustaría contratar:%0A%0A";
        carrito.forEach(p => msg += `✅ *${p.n}* - $${p.p.toLocaleString()}%0A`);
        msg += `%0A💰 *TOTAL: $${total.toLocaleString()}*%0A%0A¿Me pasas los datos para pagar?`;
        window.open(`https://wa.me/5491134361679?text=${msg}`);
    }

    init();
</script>

</body>
</html>
