 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJ NETWORKS - Catálogo Oficial</title>
    <style>
        :root { --cian: #00d4ff; --magenta: #ff00ff; --oscuro: #0a0a0a; --bg-card: #111; }
        body { background: var(--oscuro); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .header { padding: 30px 20px; text-align: center; border-bottom: 2px solid var(--cian); background: #111; }
        .header-logo { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--cian); object-fit: cover; box-shadow: 0 0 15px var(--cian); }
        .tienda-nombre { font-size: 24px; font-weight: 900; margin-top: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .seccion-titulo { color: var(--cian); text-transform: uppercase; font-size: 13px; margin: 25px 20px 10px; border-left: 4px solid var(--cian); padding-left: 10px; font-weight: 800; }
        .catalogar { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; padding: 0 20px 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { border-color: var(--magenta); transform: translateY(-3px); }
        .img-container { width: 100%; height: 130px; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; min-height: 35px; color: #fff; }
        .selector-opciones { width: 100%; padding: 8px; background: #222; color: var(--cian); border: 1px solid #444; border-radius: 5px; margin-bottom: 10px; font-size: 11px; font-weight: bold; }
        .btn-comprar { background: var(--cian); color: black; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 10px; }
        #modal-nombre { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 2px solid var(--magenta); text-align: center; width: 85%; max-width: 300px; }
        .modal-content input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #000; color: white; text-align: center; box-sizing: border-box; font-size: 16px; }
        .btn-confirmar { background: var(--magenta); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
    </style>
</head>

            <input type="text" id="input-nombre" placeholder="Tu nombre aquí">
            <button class="btn-confirmar" onclick="enviarPedido()">ENVIAR POR WHATSAPP</button>
        </div>
