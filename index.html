 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSNETWORKS - Catálogo</title>
    <style>
        :root { --cian: #00d4ff; --magenta: #ff00ff; --oscuro: #0a0a0a; }
        body { background: var(--oscuro); color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; text-align: center; margin: 0; }
        
        /* LOGOTIPO Y CABECERA */
        .header-logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--cian); box-shadow: 0 0 20px var(--cian); margin-bottom: 10px; }
        .tienda-nombre { color: var(--cian); margin: 0; font-size: 28px; text-transform: uppercase; text-shadow: 0 0 10px var(--cian); }

        /* SECCIONES */
        .seccion-titulo { color: var(--magenta); text-transform: uppercase; letter-spacing: 3px; font-size: 18px; text-shadow: 0 0 10px var(--magenta); margin: 40px 0 20px; }
        .catalogar { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }

        /* TARJETA ESTILO PREMIUM */
        .card { 
            position: relative; background-size: cover; background-position: center; 
            border-radius: 15px; min-height: 420px; border: 1px solid #333; 
            overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; 
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--cian); }
        .card-overlay { 
            position: absolute; bottom: 0; left: 0; right: 0; top: 35%;
            background: linear-gradient(to top, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            z-index: 1;
        }
        .card-info { position: relative; z-index: 2; padding: 20px; text-align: left; }
        .card-title { font-size: 20px; font-weight: bold; margin: 0; text-shadow: 2px 2px 4px black; }
        .card-desc { font-size: 12px; color: #ddd; margin: 5px 0; line-height: 1.4; }
        .card-price { font-size: 22px; color: var(--cian); font-weight: bold; text-shadow: 0 0 10px var(--cian); }

        .btn-add { background: var(--cian); border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; color: black; margin-top: 10px; text-transform: uppercase; }
        .flotacion { position: fixed; bottom: 20px; right: 20px; background: var(--magenta); color: black; padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; z-index: 100; box-shadow: 0 0 15px var(--magenta); }
    </style>
</head>
<body>

    <img src="https://img.freepik.com/vector-premium/logotipo-deportes-electronicos-jugador-auriculares_157713-10.jpg" class="header-logo" alt="Logo">
    <h1 class="tienda-nombre">JSNETWORKS</h1>
    
    <div class="seccion-titulo">Internet Lurzavic (TV + Cel)</div>
    <div id="cat-lurzavic" class="catalogar"></div>

    <div class="seccion-titulo">Internet Celular (Personal)</div>
    <div id="cat-personal" class="catalogar"></div>

    <div class="seccion-titulo">Combos Streaming</div>
    <div id="cat-combos" class="catalogar"></div>

    <div class="flotacion" onclick="enviarPedido()">🛒 TOTAL: $<span id="total-text">0</span></div>

    <script>
        const productos = [
            // LURZAVIC
            { cat: "lurzavic", n: "⚡ LURZAVIC - PRUEBA 3 HORAS", p: 0, img: "https://img.freepik.com/vector-premium/etiqueta-prueba-gratuita-diseno-plano_23-2149345028.jpg", d: "Prueba gratuita para Smart TV y Celular." },
            { cat: "lurzavic", n: "📶 LURZAVIC - 2 DISP (TV+Cel)", p: 13500, img: "https://img.freepik.com/vector-premium/icono-smart-tv-diseno-plano-ilustracion-vectorial_1102332-1083.jpg", d: "Conexión estable para 2 dispositivos." },
            { cat: "lurzavic", n: "📶 LURZAVIC - 3 DISPOSITIVOS", p: 17000, img: "https://img.freepik.com/vector-premium/icono-smart-tv-diseno-plano-ilustracion-vectorial_1102332-1083.jpg", d: "Internet ilimitado para toda la casa." },
            
            // PERSONAL
            { cat: "personal", n: "🚀 Internet CEL (30 Días)", p: 10000, img: "https://img.freepik.com/vector-premium/logotipo-vpn-proteccion-internet-privacidad-seguridad-red-datos-seguros_651234-111.jpg", d: "Navegación ilimitada sin límites de gigas." },
            
            // COMBOS
            { cat: "combos", n: "🍿 COMBO PREMIUM 4 EN 1", p: 16400, img: "https://images.vrt.be/width1280/2024/05/08/6034633f-0d36-11ef-9307-02b608fd4eb.jpg", d: "Netflix + Disney + HBO + Prime Video." },
            { cat: "combos", n: "🍿 COMBO 3 SERVICIOS", p: 9400, img: "https://hbomax-images.warnermediacdn.com/2020-05/square.png", d: "Tu elección de 3 plataformas favoritas." }
        ];

        let total = 0;
        let carrito = [];

        function render() {
            productos.forEach((p, i) => {
                const contenedor = document.getElementById(`cat-${p.cat}`);
                const html = `
                <div class="card" style="background-image: url('${p.img}')">
                    <div class="card-overlay"></div>
                    <div class="card-info">
                        <div class="card-title">${p.n}</div>
                        <div class="card-desc">${p.d}</div>
                        <div class="card-price">$${p.p.toLocaleString('es-AR')}</div>
                        <button class="btn-add" onclick="agregar(${i})">AÑADIR AL PEDIDO</button>
                    </div>
                </div>`;
                if(contenedor) contenedor.innerHTML += html;
            });
        }

        function agregar(i) {
            carrito.push(productos[i]);
            total += productos[i].p;
            document.getElementById('total-text').innerText = total.toLocaleString('es-AR');
        }

        function enviarPedido() {
            if(carrito.length === 0) return alert("Selecciona un servicio primero");
            let msg = `¡Hola JSNETWORKS! 👋 Quiero contratar:%0A`;
            carrito.forEach(p => msg += `✅ ${p.n} - $${p.p}%0A`);
            msg += `%0A💰 TOTAL: $${total.toLocaleString('es-AR')}`;
            window.open(`https://wa.me/5491134361679?text=${msg}`);
        }
        render();
    </script>
</body>
</html>
