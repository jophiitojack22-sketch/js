    <style>
        :root { --cian: #00d4ff; --magenta: #ff00ff; --oscuro: #0a0a0a; --bg-card: #111; }
        body { background: var(--oscuro); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .header { padding: 30px 20px; text-align: center; border-bottom: 2px solid var(--cian); background: #111; }
        .header-logo { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--cian); object-fit: cover; }
        .tienda-nombre { font-size: 22px; font-weight: 900; margin-top: 10px; letter-spacing: 2px; }
        .seccion-titulo { color: var(--cian); text-transform: uppercase; font-size: 13px; margin: 25px 20px 10px; border-left: 4px solid var(--cian); padding-left: 10px; font-weight: 800; }
        .catalogar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 0 20px 20px; }
        .card { background: var(--bg-card); border-radius: 8px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
        .img-container { width: 100%; height: 130px; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 10px; display: flex; flex-direction: column; }
        .card-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; min-height: 30px; }
        .selector-opciones { width: 100%; padding: 7px; background: #222; color: var(--cian); border: 1px solid #444; border-radius: 4px; margin-bottom: 10px; font-size: 11px; font-weight: bold; }
        .btn-comprar { background: var(--cian); color: black; border: none; width: 100%; padding: 10px; border-radius: 4px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 10px; }
        #modal-nombre { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 20px; border-radius: 10px; border: 2px solid var(--magenta); text-align: center; width: 80%; max-width: 280px; }
        .modal-content input { width: 100%; padding: 10px; margin: 15px 0; border-radius: 4px; border: 1px solid #444; background: #000; color: white; text-align: center; box-sizing: border-box; }
        .btn-confirmar { background: var(--magenta); color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
