 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJ NETWORKS - Catálogo Oficial</title>
    <style>
        :root { --cian: #00d4ff; --magenta: #ff00ff; --oscuro: #0a0a0a; --bg-card: #111; }
        body { background: var(--oscuro); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .header { padding: 30px 20px; text-align: center; border-bottom: 2px solid var(--cian); background: #111; }
        .header-logo { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--cian); object-fit: cover; box-shadow: 0 0 15px var(--cian); }
        .tienda-nombre { font-size: 24px; font-weight: 900; margin-top: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .frase-jack { color: var(--magenta); font-size: 13px; font-weight: bold; margin-top: 5px; text-transform: uppercase; }
        .seccion-titulo { color: var(--cian); text-transform: uppercase; font-size: 13px; margin: 25px 20px 10px; border-left: 4px solid var(--cian); padding-left: 10px; font-weight: 800; }
        .catalogar { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; padding: 0 20px 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { border-color: var(--magenta); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255, 0, 255, 0.2); }
        .img-container { width: 100%; height: 130px; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; min-height: 35px; color: #fff; }
        .selector-opciones { width: 100%; padding: 8px; background: #222; color: var(--cian); border: 1px solid #444; border-radius: 5px; margin-bottom: 10px; font-size: 11px; font-weight: bold; outline: none; }
        .btn-comprar { background: var(--cian); color: black; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 10px; }
        #modal-nombre { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 2px solid var(--magenta); text-align: center; width: 85%; max-width: 300px; }
        .modal-content input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #000; color: white; text-align: center; box-sizing: border-box; font-size: 16px; }
        .btn-confirmar { background: var(--magenta); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://i.pinimg.com/736x/21/6b/94/216b9442080072b220c34538d5830b91.jpg" class="header-logo">
        <div class="tienda-nombre">SJ NETWORKS</div>
        <div class="frase-jack">Tu entretenimiento lo encontrás acá 💀</div>
    </div>

    <div class="seccion-titulo">📺 TV Y CINE</div>
    <div id="cat-tv" class="catalogar"></div>

    <div class="seccion-titulo">🎬 CUENTAS PREMIUM</div>
    <div id="cat-streaming" class="catalogar"></div>

    <div class="seccion-titulo">📶 INTERNET Y CARGAS</div>
    <div id="cat-otros" class="catalogar"></div>

    <div id="modal-nombre">
        <div class="modal-content">
            <h3 style="margin:0; font-size:18px; color: var(--magenta);">¡PEDIDO CASI LISTO! 💀</h3>
            <p style="font-size: 13px; margin-top: 10px;">Ingresá tu nombre para procesar la compra:</p>
            <input type="text" id="input-nombre" placeholder="Tu nombre o apodo">
            <button class="btn-confirmar" onclick="enviarPedido()">ENVIAR A WHATSAPP</button>
        </div>
    </div>

    <script>
        const productos = [
            { cat: "tv", nombre: "Magis TV (Oficial)", img: "https://i.ibb.co/L6S8tG0/magis-tv.jpg", opciones: ["1 Mes ➝ $4.500", "3 Meses ➝ $12.000"] },
            { cat: "tv", nombre: "Tele Latino", img: "https://i.ibb.co/hZ7X9L1/tele-latino.jpg", opciones: ["1 Mes ➝ $4.000", "Anual ➝ $25.000"] },
            { cat: "streaming", nombre: "Netflix Premium", img: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400", opciones: ["1 Pantalla ➝ $6.000", "2 Pantallas ➝ $8.000", "Cuenta Completa ➝ $12.000"] },
            { cat: "streaming", nombre: "Disney+ Premium", img: "https://images.unsplash.com/photo-1635334336040-3b4f69747c3e?w=400", opciones: ["1 Pantalla ➝ $5.000", "2 Pantallas ➝ $7.000", "Cuenta Completa ➝ $14.000"] },
            { cat: "streaming", nombre: "Amazon Prime Video", img: "https://images.unsplash.com/photo-1585647347384-2593bcc357d3?w=400", opciones: ["1 Mes ➝ $4.000"] },
            { cat: "streaming", nombre: "Spotify Premium", img: "https://images.unsplash.com/photo-1614680376593-902f74cf0d41?w=400", opciones: ["30 Días ➝ $2.800", "60 Días ➝ $5.400"] },
            { cat: "otros", nombre: "Internet Ilimitado (Lurzavic)", img: "https://i.ibb.co/L6S8tG0/internet-vph.jpg", opciones: ["30 Días ➝ $10.000", "Prueba Gratis"] },
            { cat: "otros", nombre: "Free Fire 💎", img: "https://i.pinimg.com/736x/0a/6c/0e/0a6c0e52a8b981503893322675685785.jpg", opciones: ["Consultar Packs de Diamantes"] }
        ];

        let pedidoTemporal = "";

        function render() {
            productos.forEach((p, i) => {
                const cont = document.getElementById(`cat-${p.cat}`);
                let opts = p.opciones.map(o => `<option value="${o}">${o}</option>`).join('');
                cont.innerHTML += `
                    <div class="card">
                        <div class="img-container"><img src="${p.img}" class="card-img"></div>
                        <div class="card-body">
                            <div class="card-title">${p.nombre}</div>
                            <select id="s-${i}" class="selector-opciones">${opts}</select>
                            <button class="btn-comprar" onclick="confirmar(${i})">Comprar</button>
                        </div>
                    </div>`;
            });
        }

        function confirmar(i) {
            const opcion = document.getElementById(`s-${i}`).value;
            pedidoTemporal = `🛒 *${productos[i].nombre}*%0A📍 *Opción:* ${opcion}`;
            document.getElementById('modal-nombre').style.display = 'flex';
        }

        function enviarPedido() {
            const nombre = document.getElementById('input-nombre').value;
            if(!nombre) return alert("Por favor, poné tu nombre.");
            const nro = "5491134361679";
            window.open(`https://wa.me/${nro}?text=¡Hola Jack! 💀%0A%0ASoy: *${nombre}*%0AQuiero contratar: ${pedidoTemporal}`);
            document.getElementById('modal-nombre').style.display = 'none';
        }

        window.onload = render;
    </script>
</body>
</html>
