 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSNETWORKS-jack</title>
    <style>
        :root {
            --bg: #000000;
            --card: #0a0a0a;
            --blue: #00d4ff;
            --text: #ffffff;
            --border: #1a1a1a;
        }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 25px; width: 90%; max-width: 380px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.1); }
        .jack-head { width: 70px; height: 70px; margin: 0 auto 15px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="%2300d4ff" stroke-width="2"/><ellipse cx="33" cy="40" rx="10" ry="15" fill="black" stroke="%2300d4ff" stroke-width="1"/><ellipse cx="67" cy="40" rx="10" ry="15" fill="black" stroke="%2300d4ff" stroke-width="1"/><path d="M35 72 Q50 78 65 72" fill="none" stroke="%2300d4ff" stroke-width="2"/><path d="M40 70 L40 76 M45 71 L45 77 M50 72 L50 78 M55 71 L55 77 M60 70 L60 76" stroke="%2300d4ff" stroke-width="1"/></svg>') no-repeat center; }
        h1 { color: var(--blue); text-align: center; font-size: 20px; letter-spacing: 3px; margin-bottom: 25px; text-transform: uppercase; }
        label { display: block; font-size: 11px; color: #555; margin-bottom: 5px; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 15px; box-sizing: border-box; }
        .info-row { display: flex; justify-content: space-between; background: #000; padding: 12px; border-radius: 8px; border-left: 3px solid var(--blue); font-size: 13px; margin-top: 10px; }
        .btn { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .btn-ws { background: var(--blue); color: #000; }
        .btn-pay { background: transparent; color: var(--blue); border: 1px solid var(--blue); }
    </style>
</head>
<body>
<div class="container">
    <div class="jack-head"></div>
    <h1>JSNETWORKS-jack</h1>
    <label>Cliente</label>
    <input type="text" placeholder="Nombre">
    <label>Servicio / Perfil</label>
    <textarea rows="2" placeholder="Ej: Netflix Perfil 1"></textarea>
    <div class="info-row">
        <span>VENCE: <strong>10/06/2026</strong></span>
        <span>DÍAS: <strong>30</strong></span>
    </div>
    <button class="btn btn-ws">Enviar por WhatsApp</button>
    <button class="btn btn-pay">Cobrar Servicio</button>
</div>
</body>
</html>
