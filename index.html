<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS NETWORKS - CONTROL</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background-color: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 0 15px rgba(255,0,0,0.2); }
        h2 { color: #ff0000; text-align: center; margin-bottom: 20px; }
        label { color: #ff0000; font-weight: bold; display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .flex { display: flex; gap: 10px; }
        .vence { background: #000; padding: 15px; border-radius: 5px; margin-top: 15px; border: 1px solid #444; display: flex; justify-content: space-between; }
        .dias { color: #00ff00; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-ws { background-color: #25d366; color: #000; }
        .btn-cobrar { background-color: #ffc107; color: #000; }
    </style>
</head>
<body>
<div class="card">
    <h2>CONTROL JS NETWORKS</h2>
    <label>PERFIL 1</label>
    <input type="text" id="perfil" value="jack">
    <div class="flex">
        <div style="flex: 2;"><label>INICIO</label><input type="date" id="fechaInicio" value="2026-05-10"></div>
        <div style="flex: 1;"><label>PIN</label><input type="text" id="pin" value="0000"></div>
    </div>
    <label>OBSERVACIONES</label>
    <textarea id="obs" rows="3" placeholder="Notas..."></textarea>
    <div class="vence"><span>VENCE EL: <strong>09/06/2026</strong></span><span class="dias">DÍAS: 30</span></div>
    <div class="btn-group">
        <button class="btn-ws">WhatsApp ENVIAR</button>
        <button class="btn-cobrar">COBRAR</button>
    </div>
</div>
</body>
</html>
