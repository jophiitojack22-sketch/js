 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSNETWORKS | Premium Services</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #050505;
            --card: #0d0d0d;
            --cyan: #00d4ff;
            --purple: #9d00ff;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding-bottom: 120px;
            background-image: radial-gradient(circle at 50% -20%, #001a2e 0%, #050505 80%);
        }

        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .search-container {
            padding: 10px 20px;
            max-width: 500px;
            margin: -25px auto 20px;
        }

        #searchInput {
            width: 100%;
            padding: 15px;
            background: var(--card);
            border: 1px solid #222;
            border-radius: 30px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        #searchInput:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            transition: 0.3s;
        }

        .card:hover { border-color: var(--cyan); transform: translateY(-5px); }

        .card-img { width: 100%; height: 110px; object-fit: cover; }
        
        .card-info { padding: 12px; text-align: center; }
        
        .card-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; height: 32px; }
        
        .card-price { color: var(--cyan); font-weight: 800; font-size: 18px; margin-bottom: 12px; }

        .btn-add {
            background: var(--glass);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer-bar {
            position: fixed;
            bottom: 0; width: 100%;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-top: 1px solid var(--cyan);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
        }

        .total-info { display: flex; flex-direction: column; }
        .total-price { font-size: 22px; font-weight: bold; color: var(--cyan); }

        .btn-checkout {
            background: #25d366;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center; gap: 8px;
        }

        /* Modal para el nombre */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center; justify-content: center;
        }

        .modal-content {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--cyan);
            width: 80%;
            max-width: 300px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<header>
    <h1 style="color: var(--cyan); letter-spacing: 5px; margin: 0;">JSNETWORKS</h1>
    <p style="color: #666; font-size: 12px;">CALIDAD Y SEGURIDAD</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Buscar plataforma..." onkeyup="filterProducts()">
</div>

<div class="grid" id="catalog"></div>

<div class="footer-bar">
    <div class="total-info">
        <span style="font-size: 10px; color: #888;">TOTAL:</span>
        <span class="total-price">$<span id="total-text">0</span></span>
    </div>
    <a href="#" class="btn-checkout" onclick="openModal()">
        <i class="fab fa-whatsapp"></i> COMPRAR
    </a>
</div>

<div id="modal">
    <div class="modal-content">
        <h3>¿Cuál es tu nombre?</h3>
        <input type="text" id="userName" placeholder="Tu nombre aquí...">
        <button class="btn-add" onclick="sendOrder()">ENVIAR PEDIDO</button>
    </div>
</div>

<script>
    const products = [
        { n: "Netflix Código TV", p: 14000, img: "https://variety.com/wp-content/uploads/2020/05/netflix-logo.png" },
        { n: "HBO Max Platino", p: 11000, img: "https://hbomax-images.warnermediacdn.com/2020-05/square.png" },
        { n: "Disney+ Premium", p: 14000, img: "https://static-assets.bamgrid.com/product/disneyplus/images/share-default.14f44445346633f5ca97412f0534a7a8.png" },
        { n: "Prime Video", p: 6000, img: "https://m.media-amazon.com/images/G/01/primevideo/seo/primevideo-seo-logo.png" },
        { n: "Internet Ilimitado", p: 10000, img: "https://img.freepik.com/vector-premium/logotipo-vpn-proteccion-internet-privacidad-seguridad-red-datos-seguros_651234-111.jpg" },
        { n: "Free Fire 520 💎", p: 8000, img: "https://i.pinimg.com/736x/8d/8a/8d/8d8a8d1b1b1b1b1b1b1b1b1b1b1b1b1b.jpg" }
    ];

    let cart = [];
    let total = 0;

    function render(data = products) {
        const catalog = document.getElementById('catalog');
        catalog.innerHTML = '';
        data.forEach((p, i) => {
            catalog.innerHTML += `
                <div class="card">
                    <img src="${p.img}" class="card-img">
                    <div class="card-info">
                        <div class="card-title">${p.n}</div>
                        <div class="card-price">$${p.p.toLocaleString()}</div>
                        <button class="btn-add" onclick="add(${i})">AÑADIR</button>
                    </div>
                </div>`;
        });
    }

    function add(i) {
        cart.push(products[i]);
        total += products[i].p;
        document.getElementById('total-text').innerText = total.toLocaleString();
    }

    function filterProducts() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => p.n.toLowerCase().includes(term));
        render(filtered);
    }

    function openModal() {
        if(cart.length === 0) return alert("Elige un servicio");
        document.getElementById('modal').style.display = 'flex';
    }

    function sendOrder() {
        const name = document.getElementById('userName').value;
        if(!name) return alert("Por favor, ingresa tu nombre");
        
        let msg = `¡Hola *JSNETWORKS*! 👋%0ASoy *${name}* y quiero comprar:%0A%0A`;
        cart.forEach(p => msg += `✅ *${p.n}* - $${p.p.toLocaleString()}%0A`);
        msg += `%0A💰 *TOTAL: $${total.toLocaleString()}*`;
        
        window.open(`https://wa.me/5491134361679?text=${msg}`);
        document.getElementById('modal').style.display = 'none';
    }

    render();
</script>
</body>
</html>
