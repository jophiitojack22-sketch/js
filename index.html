 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSNETWORKS - Tienda Oficial</title>
    <style>
        :root { --cian: #00d4ff; --magenta: #ff00ff; --oscuro: #0a0a0a; --bg-card: #141414; }
        body { background: var(--oscuro); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        /* HEADER */
        .header { padding: 30px; text-align: center; background: linear-gradient(to bottom, #1a1a1a, var(--oscuro)); }
        .header-logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--cian); box-shadow: 0 0 20px var(--cian); }
        .tienda-nombre { font-size: 24px; font-weight: bold; margin-top: 10px; letter-spacing: 2px; }

        /* SECCIONES */
        .seccion-titulo { color: var(--magenta); text-transform: uppercase; margin: 30px 20px 10px; border-left: 4px solid var(--magenta); padding-left: 10px; font-size: 14px; }
        .catalogar { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 20px; }

        /* TARJETAS */
        .card { background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid #222; transition: 0.3s; position: relative; }
        .card:hover { border-color: var(--cian); transform: translateY(-5px); }
        .img-box { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 15px; text-align: left; }
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; height: 35px; overflow: hidden; }
        .card-price { font-size: 18px; color: var(--cian); font-weight: 800; }

        /* BOTONES */
        .btn-add { background: var(--cian); color: black; border: none; width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .flotante { position: fixed; bottom: 20px; right: 20px; background: var(--magenta); color: white; padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; z-index: 100; box-shadow: 0 0 15px var(--magenta); }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.pinimg.com/736x/21/6b/94/216b9442080072b220c34538d5830b91.jpg" class="header-logo" alt="Jack">
        <div class="tienda-nombre">JSNETWORKS</div>
    </div>

    <div class="seccion-titulo">Internet Ilimitado & Lurzavic</div>
    <div id="cat-internet" class="catalogar"></div>

    <div class="seccion-titulo">Cuentas Streaming</div>
    <div id="cat-streaming" class="catalogar"></div>

    <div class="flotante" onclick="enviarPedido()">
        🛒 PEDIR POR WHATSAPP ($<span id="total-text">0</span>)
    </div>

    <script>
        const productos = [
            { cat: "internet", n: "Lurzavic Prueba 3H", p: 0, img: "https://img.freepik.com/vector-premium/etiqueta-prueba-gratis_24911-47451.jpg" },
            { cat: "internet", n: "Internet Móvil VPN", p: 10000, img: "https://img.freepik.com/vector-premium/logotipo-vpn-proteccion-internet_24911-47000.jpg" },
            { cat: "streaming", n: "Netflix Premium 4K", p: 7500, img: "https://geizhals.at/magazin/wp-content/uploads/2019/11/netflix-logo.jpg" },
            { cat: "streaming", n: "Disney+ Premium", p: 4800, img: "https://cnnespanol.cnn.com/wp-content/uploads/2019/04/disney-plus-logo.jpg?quality=100&strip=info" },
            { cat: "streaming", n: "HBO Max / Max", p: 4500, img: "https://hbomax-images.warnermediacdn.com/2020-05/square.png" }
        ];

        let total = 0;
        let carrito = [];

        function mostrar() {
            productos.forEach((p, i) => {
                const caja = document.getElementById(`cat-${p.cat}`);
                if (caja) {
                    caja.innerHTML += `
                        <div class="card">
                            <img src="${p.img}" class="img-box">
                            <div class="card-body">
                                <div class="card-title">${p.n}</div>
                                <div class="card-price">$${p.p.toLocaleString()}</div>
                                <button class="btn-add" onclick="agregar(${i})">AÑADIR AL PEDIDO</button>
                            </div>
                        </div>`;
                }
            });
        }

        function agregar(i) {
            carrito.push(productos[i]);
            total += productos[i].p;
            document.getElementById('total-text').innerText = total.toLocaleString();
        }

        function enviarPedido() {
            if(carrito.length === 0) return alert("Elegí un servicio primero");
            let texto = "¡Hola JSNETWORKS! 👋 Quiero contratar:%0A";
            carrito.forEach(p => texto += `- ${p.n} ($${p.p})%0A`);
            texto += "%0A💰 TOTAL: $" + total;
            window.open("https://wa.me/5491134361679?text=" + texto);
        }

        mostrar();
    </script>
</body>
</html>
